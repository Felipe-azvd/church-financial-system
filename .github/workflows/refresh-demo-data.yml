name: Atualizar dados de demonstração

on:
  schedule:
    - cron: '0 6 1 * *' # dia 1 de cada mês, 06:00 UTC
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsx prisma/reset-demo-data.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
